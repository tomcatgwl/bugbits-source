<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BugBits Web</title>
<style>
  @font-face { font-family: 'Noto Sans SC'; src: url('NotoSansSC-subset.woff2') format('woff2');
               font-display: swap; }
  body { font-family: 'Noto Sans SC', system-ui, sans-serif; background: #14161a; color: #d8dcd8;
         margin: 0; padding: 16px; }
  header { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; }
  #status { font-size: 14px; }
  #status.ok { color: #7ec97e; }
  #status.error { color: #e07070; }
  #error-box { border: 1px solid #a04040; background: #301818; padding: 10px;
               border-radius: 6px; margin-top: 10px; white-space: pre-wrap;
               overflow-wrap: anywhere; }
  #layout { display: flex; gap: 16px; margin-top: 14px; flex-wrap: wrap; }
  /* The logical/backing canvas stays square. worldstage exposes exactly the
     active world's content; translation removes only its non-world padding. */
  #worldstage { width: 100%; aspect-ratio: var(--stage-aspect, 1); min-height: 0;
                overflow: hidden; padding: 0; border: 0;
                position: relative; z-index: 0; }
  #scene { background: #0c0e10; border: 0;
           width: 100%; aspect-ratio: 1 / 1; height: auto;
           display: block; transform: translateY(var(--scene-shift, 0%));
           cursor: url("assets/gui/gizmos/cursor_v1_a.png") 16 16, auto; }
  /* UI-01：flex-basis 220（而非 auto=max-content）——换行判定用假设主尺寸，
     旧版 side 假设尺寸=max-width 360 → 642+16+360>容器 必换行到画布下方
     （1000×760 首屏操作栏出屏）。basis 220 + grow 填充剩余空间（1000 视口
     实得 ~310），窄视口换行后独占整行。 */
  #side { flex: 1 1 220px; min-width: 220px; max-width: 360px; }
  #hud { display: flex; gap: 14px; font-size: 14px; margin: 8px 0;
         flex-wrap: wrap; }
  #hud-nectar { color: #e8c84a; font-size: 18px; font-weight: 600; }
  #hud-timer { color: #e0a050; }
  #hud-title { font-weight: 600; }
  #hud-objective { color: #a8b0a8; font-size: 12px; white-space: pre-wrap;
                   overflow-wrap: anywhere; }
  #battlefield { position: relative; width: var(--battlefield-width, 642px);
                max-width: 100%; }
  #scene-shell { position: relative; border: 1px solid #33383e; }
  #buybar { position: absolute; left: 9px; top: 64px; display: flex; z-index: 3;
            flex-direction: column; gap: 28px; width: 110px; margin: 0;
            padding-bottom: 24px; box-sizing: border-box;
            max-height: calc(100% - 145px);
            overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; }
  #controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #diagnostics { margin-top: 12px; }
  #diagnostics summary { cursor: pointer; font-size: 13px; }
  #buy-feedback { margin-top: 6px; font-size: 13px; min-height: 18px; }
  #buy-feedback.ok { color: #7ec97e; }
  #buy-feedback.reject { color: #e07070; }
  /* OF-04：原作买兵按钮=maingui_circle 圆底 + maingui_bug_* 图标 + nectar_01 价格
     + ReloadTime 倒计时覆盖（STATIC，research/of04_layout.py 57 断言）。 */
  button.buy { position: relative; width: 90px; height: 90px; padding: 0;
               cursor: pointer; border: none; border-radius: 50%;
               background: url("assets/gui/main/maingui_circle.png") center/contain no-repeat;
               display: flex; flex-direction: column; align-items: center;
               justify-content: center;
               flex-shrink: 0; image-rendering: pixelated; }
  button.buy .buy-icon { width: 62px; height: 62px; object-fit: contain;
                         image-rendering: pixelated; pointer-events: none;
                         margin-top: 2px; }
  button.buy .buy-label { font-size: 11px; color: #f0e8d0; line-height: 1;
                          text-shadow: 1px 1px 0 #000; max-width: 84px;
                          overflow: hidden; text-overflow: ellipsis;
                          white-space: nowrap; }
  /* Original parentage; responsive offsets are engineering adaptation. */
  .buy-price-bar { position: absolute; left: 0; top: 83px; width: 89px; height: 29px;
    background: url("assets/gui/main/maingui_bar.png") center/contain no-repeat;
    pointer-events: none; }
  .buy-price-bar::before { content: ""; position: absolute; left: 16px; top: 4px;
    width: 20px; height: 20px;
    background: url("assets/gui/nectar_01.png") center/contain no-repeat; }
  button.buy .price { position: absolute; left: 28px; top: -4px;
    width: 48px; height: 32px; line-height: 32px; text-align: center;
    font-size: 16px; font-weight: 700; color: #ffe8b0; text-shadow: 1px 1px 0 #000; }
  button.buy .reload { position: absolute; inset: 0; display: flex;
                       align-items: center; justify-content: center;
                       font-size: 18px; font-weight: 700; color: #ffd060;
                       background: rgba(0,0,0,0.55); border-radius: 50%;
                       text-shadow: 1px 1px 0 #000; pointer-events: none; }
  button.buy:hover:not(:disabled) { filter: brightness(1.15); }
  button.buy:disabled { opacity: 0.45; cursor: not-allowed; }
  /* Form controls have a UA font; inherit the bundled Chinese family explicitly. */
  button, select, input { font-family: inherit; }
  button, select { padding: 6px; background: #22262a; color: #d8dcd8;
                    border: 1px solid #4a5a5a; border-radius: 4px; }
  /* UI-01：诊断区有界（不删内容）——eventlog 原有 max-height 160 保留，
     补长词断行（overflow-wrap:anywhere：事件行 JSON 无空格，min-content 否则
     顶宽侧栏把 #side 挤出并排列 → 1000×760 首屏操作栏出屏）。 */
  #eventlog { margin-top: 12px; font-size: 11px; font-family: monospace;
              color: #a8b0a8; max-height: 160px; overflow-y: auto;
              overflow-wrap: anywhere;
              border: 1px solid #33383e; padding: 6px; border-radius: 6px; }
  #fallback-report { margin-top: 12px; font-size: 12px; color: #9aa29a;
                     border: 1px solid #3a403a; padding: 8px; border-radius: 6px;
                     max-height: 240px; overflow-y: auto;
                     overflow-wrap: anywhere; }
  #fallback-report.warn { color: #d8b050; border-color: #6a5a2a; }
  #audio-note { margin-top: 8px; font-size: 12px; color: #c0a050;
                max-height: 96px; overflow-y: auto; overflow-wrap: anywhere; }
  .overlay { position: fixed; inset: 0; background: rgba(10,12,14,0.92);
             display: flex; flex-direction: column; gap: 16px;
             align-items: center; z-index: 10;
             overflow-y: auto; padding: 24px 0; }
  /* 选关遮罩消费原作 map_bg_lowres（DATA，of04_layout.py）；终局屏 #endscreen 不覆盖 */
  #overlay { background: url("assets/gui/map/map_bg_lowres.png") center/cover no-repeat,
             rgba(10,12,14,0.88); }
  /* 居中用 auto margin（内容溢出时退化为顶部对齐——justify-content:center
     会使溢出顶部不可滚动到达，62 关列表曾把 level_02 按钮裁出视口） */
  .overlay > :first-child { margin-top: auto; }
  .overlay > :last-child { margin-bottom: auto; }
  [hidden] { display: none !important; }   /* 防 class display 覆盖 hidden */
  .overlay h2 { margin: 0; }
  .level-btn { display: block; width: 260px; margin: 4px 0; padding: 10px;
               font-size: 15px; }
  .level-btn.sel { border-color: #7ec97e; color: #a8e0a8; }
  .level-group { width: 260px; margin-top: 14px; font-size: 13px; color: #7ec97e;
                 border-bottom: 1px solid #3a4a3a; padding-bottom: 3px; }
  #seed-input { width: 120px; }
  #start-btn { padding: 10px 28px; font-size: 16px; background: #2a4a2a;
               border: 1px solid #4a7a4a; color: #d8f0d8; }
  #end-title { font-size: 28px; margin: 0; }
  #end-title.win { color: #7ec97e; }
  #end-title.lose { color: #e07070; }
  #end-text { max-width: 480px; white-space: pre-wrap; text-align: center;
              color: #c8ccc8; }
  footer { margin-top: 18px; font-size: 12px; color: #8a928a; }
  #tick { font-variant-numeric: tabular-nums; }
  #hud { position: absolute; left: 1px; top: 1px; margin: 0; width: 256px; height: 43px;
    box-sizing: border-box; padding: 6px 34px; gap: 14px; align-items: center;
    background: url("assets/gui/main/maingui_top.png") center/contain no-repeat;
    color: #ffe8b0; text-shadow: 1px 1px 2px #000; pointer-events: none; }
  .nectar-stat { display: flex; align-items: center; gap: 5px; }
  .nectar-stat::before { content: ""; width: 22px; height: 22px;
    background: url("assets/gui/nectar_01.png") center/contain no-repeat; }
  #mission { position: absolute; top: 10px; left: 268px; right: 12px;
    text-align: center; color: #ffe8b0; text-shadow: 1px 1px 2px #000;
    pointer-events: none; }
  #hud-objective { color: inherit; font-size: 13px; }
  #hud-hives { position: absolute; bottom: 1px; left: 1px; right: 1px;
    display: flex; justify-content: space-between; pointer-events: none; }
  #hud, #mission, #hud-hives { z-index: 2; }
  .hive-hud { width: 185px; height: 60px; position: relative;
    background: url("assets/gui/main/maingui_base_small.png") center/contain no-repeat; }
  .hive-hud.enemy { background-image: url("assets/gui/main/maingui_base_small_right.png"); }
  .hive-value { position: absolute; left: 20px; top: 11px; color: #ffe8b0;
    font-size: 16px; font-weight: 700; text-shadow: 1px 1px 1px #000; }
  .enemy .hive-value { left: auto; right: 20px; }
  .hive-meter { position: absolute; left: 38px; bottom: 7px; width: 119px; height: 13px; }
  .enemy .hive-meter { left: 28px; }
  .hive-track { position: absolute; inset: 0;
    background: url("assets/gui/main/maingui_basebar_small.png") left center/119px 13px no-repeat;
    filter: url(#hive-track-tint); }
  .hive-fill { position: absolute; display: block; height: 100%;
    filter: url(#hive-fill-tint);
    background: url("assets/gui/main/maingui_basebar_small.png") left center/119px 13px no-repeat; }
  .enemy .hive-fill { right: 0; background-position: right center; }
  /* UI-01 窄视口（≤480px）紧凑化：侧栏换行到画布下方后，操作控件仍须
     首屏可同时使用（战场+操作合同优先于并排布局）。只收间距，不缩小
     控件/字号（禁止整体缩小全页塞截图）。 */
  @media (max-width: 480px) {
    body { padding: 8px; }
    #layout { gap: 10px; margin-top: 8px; }
    #buybar { margin-top: 6px; }
    #hud { gap: 8px; margin: 6px 0; }
    #buybar { position: static; flex-direction: row; flex-wrap: nowrap;
      width: auto; gap: 8px; max-height: none; height: 130px;
      overflow-x: auto; overflow-y: hidden; margin-top: 8px; }
    #hud { margin: 0; width: 230px; padding: 6px 28px; }
    #mission { left: 232px; right: 5px; top: 4px; font-size: 12px; }
    #hud-objective { font-size: 11px; }
    .hive-hud { width: 148px; height: 48px; }
    .hive-value { top: 8px; left: 16px; font-size: 13px; }
    .enemy .hive-value { right: 16px; }
    .hive-meter { left: 30px; bottom: 6px; width: 95px; height: 10px; }
    .enemy .hive-meter { left: 23px; }
    .hive-fill, .hive-track { background-size: 95px 10px; }
  }
</style>
</head>
<body>
<!-- STATIC HUD material: foreground FFFFC060, background 80606060.
     Multiply source RGBA exactly; do not approximate with a colour wash. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="hive-fill-tint" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="1 0 0 0 0  0 0.7529411765 0 0 0  0 0 0.3764705882 0 0  0 0 0 1 0"/>
    </filter>
    <filter id="hive-track-tint" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0.3764705882 0 0 0 0  0 0.3764705882 0 0 0  0 0 0.3764705882 0 0  0 0 0 0.5019607843 0"/>
    </filter>
  </defs>
</svg>
<div id="error-box" hidden><b>错误</b><div id="error-detail"></div></div>
<div id="layout">
  <div id="battlefield">
    <div id="scene-shell">
    <div id="hud">
      <span class="nectar-stat" title="花蜜"><span id="hud-nectar">—</span></span>
      <span title="我方在场单位">虫 <span id="hud-units">—</span></span>
    </div>
    <div id="mission"><span id="hud-title"></span><div id="hud-objective"></div>
      <span id="hud-timer"></span></div>
    <div id="worldstage"><canvas id="scene" width="640" height="640"></canvas></div>
    <div id="hud-hives">
      <div class="hive-hud"><span id="hud-mine" class="hive-value"></span>
        <div class="hive-meter"><span class="hive-track"></span>
          <span id="hud-mine-fill" class="hive-fill"></span></div></div>
      <div class="hive-hud enemy"><span id="hud-enemy" class="hive-value"></span>
        <div class="hive-meter"><span class="hive-track"></span>
          <span id="hud-enemy-fill" class="hive-fill"></span></div></div>
    </div>
    </div>
    <div id="buybar" aria-label="购买单位"></div>
  </div>
  <div id="side">
    <div id="controls" aria-label="对局控制"></div>
    <div id="status">运行时加载中…</div>
    <div id="buy-feedback" hidden></div>
    <div id="audio-note" hidden></div>
    <details id="diagnostics"><summary>运行记录</summary>
    <header>
      <h1>BugBits · 网页版</h1>
      <span>tick <span id="tick">0</span></span>
    </header>
    <div id="eventlog" class="eventlog"></div>
    <div id="fallback-report">（待载入）</div>
    <footer>蜂巢世界模型与原作动态视角、行为对照未完成。</footer>
    </details>
  </div>
</div>
<div id="overlay" class="overlay" hidden>
  <h2>选择关卡</h2>
  <div id="level-list"></div>
  <label>种子 <input id="seed-input" type="number" value="2026"></label>
  <button id="start-btn">开 始</button>
</div>
<div id="endscreen" class="overlay" hidden>
  <h2 id="end-title"></h2>
  <div id="end-text"></div>
  <div id="end-tick"></div>
  <div>
    <button id="end-restart">重 开</button>
    <button id="end-back">返回选关</button>
  </div>
</div>
<script src="camera_projection.js"></script>
<script src="presentation_material.js"></script>
<script src="flower_pose.js"></script>
<script src="mesh_scene.js"></script>
<script src="host.js"></script>
</body>
</html>
